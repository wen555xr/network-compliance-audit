#
# SW-Core 核心交换机配置（Huawei S5700）
# 角色：核心层三层网关 + 合规安全基线标杆（预期 10/10 合规）
# 用法：eNSP 中打开设备 CLI，进入系统视图后逐段粘贴
#
sysname SW-Core

# ---------- VLAN ----------
vlan batch 10 20 30 100

# ---------- 生成树 ----------
stp enable
stp mode rstp

# ---------- SSH 使能（rsa local-key-pair create 为交互式，回车采用默认长度） ----------
rsa local-key-pair create
stelnet server enable
ssh user admin authentication-type password
ssh user admin service-type stelnet

# ---------- AAA 本地用户（irreversible-cipher 不可逆加密 + 强口令） ----------
aaa
 local-user admin password irreversible-cipher Core@Mgmt#2024
 local-user admin privilege level 15
 local-user admin service-type ssh

# ---------- 管理 ACL（仅允许网管网段登录） ----------
acl number 2000
 rule 5 permit source 192.168.100.0 0.0.0.255
 rule 10 deny

# ---------- 三层网关接口（业务 + 管理，管理IP走 VLANIF） ----------
interface Vlanif10
 ip address 192.168.10.1 255.255.255.0
interface Vlanif20
 ip address 192.168.20.1 255.255.255.0
interface Vlanif30
 ip address 192.168.30.1 255.255.255.0
interface Vlanif100
 ip address 192.168.100.1 255.255.255.0

# ---------- 下联汇聚层 Trunk ----------
interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100

# ---------- 上联 Cloud（管理通道 VLAN100） ----------
interface GigabitEthernet0/0/24
 port link-type access
 port default vlan 100

# ---------- SNMP（自定义社区串 + cipher 加密） ----------
snmp-agent community read cipher CoreAudit@2024

# ---------- 日志（集中日志服务器 + 时间戳） ----------
info-center enable
info-center loghost 192.168.100.250
info-center timestamp log date

# ---------- 远程管理（仅 SSH + ACL 限制登录源） ----------
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 acl 2000 inbound
return
