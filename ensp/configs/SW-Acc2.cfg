#
# SW-Acc2 接入交换机配置（Huawei S5700）
# 角色：接入层（研发 VLAN20 / 访客监控 VLAN30）
# 合规缺口（高危重灾区，预期 3/10 合规）：
#   明文弱口令 / 未启用 SSH / Telnet 明文开启 / HTTP 开启 / SNMP 默认明文串 / 缺日志服务器
#
sysname SW-Acc2

# ---------- VLAN ----------
vlan batch 20 30 100

# ---------- 生成树 ----------
stp enable
stp mode rstp

# ---------- 违规：未生成密钥、未启用 STelnet（改用 Telnet 明文） ----------
telnet server enable

# ---------- AAA 本地用户（违规：明文 simple 密码 + 默认弱口令 Admin@123） ----------
aaa
 local-user admin password simple Admin@123
 local-user admin privilege level 15
 local-user admin service-type telnet

# ---------- 管理 ACL（存在，但未覆盖 Telnet 风险） ----------
acl number 2000
 rule 5 permit source 192.168.100.0 0.0.0.255
 rule 10 deny

# ---------- 管理 VLANIF ----------
interface Vlanif100
 ip address 192.168.100.12 255.255.255.0

# ---------- 上联汇聚 Trunk ----------
interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 20 30 100

# ---------- 研发接入（VLAN20） ----------
interface GigabitEthernet0/0/2
 port link-type access
 port default vlan 20

# ---------- 访客/监控接入（VLAN30） ----------
interface GigabitEthernet0/0/3
 port link-type access
 port default vlan 30
interface GigabitEthernet0/0/4
 port link-type access
 port default vlan 30

# ---------- SNMP（违规：默认只读社区串 public，明文） ----------
snmp-agent community read public

# ---------- 违规：开启 HTTP 明文 Web 管理 ----------
http server enable

# ---------- 日志（仅开启时间戳，未配置日志服务器） ----------
info-center enable
info-center timestamp log date

# ---------- 远程管理（违规：Telnet 明文；虽加 ACL 但服务协议不安全） ----------
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound telnet
 acl 2000 inbound
return
