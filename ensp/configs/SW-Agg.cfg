#
# SW-Agg 汇聚交换机配置（Huawei S5700）
# 角色：汇聚层纯二层 Trunk
# 合规缺口：缺日志服务器 / 缺日志时间戳 / 缺管理 ACL（预期 7/10 合规）
#
sysname SW-Agg

# ---------- VLAN ----------
vlan batch 10 20 30 100

# ---------- 生成树 ----------
stp enable
stp mode rstp

# ---------- SSH 使能 ----------
rsa local-key-pair create
stelnet server enable
ssh user admin authentication-type password
ssh user admin service-type stelnet

# ---------- AAA 本地用户（irreversible-cipher 不可逆加密 + 强口令） ----------
aaa
 local-user admin password irreversible-cipher Agg@Mgmt#2024
 local-user admin privilege level 15
 local-user admin service-type ssh

# ---------- 管理 VLANIF ----------
interface Vlanif100
 ip address 192.168.100.2 255.255.255.0

# ---------- 上联核心 Trunk ----------
interface GigabitEthernet0/0/1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100

# ---------- 下联接入口1 Trunk（VLAN10/100） ----------
interface GigabitEthernet0/0/2
 port link-type trunk
 port trunk allow-pass vlan 10 100

# ---------- 下联接入口2 Trunk（VLAN20/30/100） ----------
interface GigabitEthernet0/0/3
 port link-type trunk
 port trunk allow-pass vlan 20 30 100

# ---------- SNMP（自定义社区串 + cipher 加密） ----------
snmp-agent community read cipher AggAudit@2024

# ---------- 远程管理（仅 SSH；缺日志与 ACL 配置，见合规基线） ----------
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
return
